# yaml-language-server: $schema=./schema/depgraph.schema.json
# depgraph's own architecture (see docs/configuration.md).
layers:
  domain: ["pkg/domain/**"]
  services: ["pkg/services/**"]
  infrastructure: ["pkg/infrastructure/**"]
  interfaces: ["pkg/interfaces/**"]
  # third-party packages (ext:* never matches the standard library)
  frameworks: ["ext:*"]
forbidden:
  domain: [infrastructure, services, interfaces, frameworks]
  services: [interfaces, frameworks]
  infrastructure: [interfaces, services]
# the use cases get their stores and resolvers as interfaces; pkg/interfaces/cmd
# (the composition root) builds the implementations
abstract:
  services: [infrastructure]
rules:
  # `vite build --mode mcp-app` starts the MCP App from this file instead of
  # src/main.ts (web/vite.config.ts), which index.html cannot show
  unreachable-file: {entries: ["web/src/mcp-app.ts"]}
