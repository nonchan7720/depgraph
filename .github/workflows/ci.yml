name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # re-run after third-party-notices pushes a regenerated file

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Integration tests (graph / rules / project repositories, cmd) use it;
      # they skip themselves when Neo4j is unreachable.
      neo4j:
        image: neo4j:5.26.32@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
        env:
          NEO4J_AUTH: neo4j/depgraph123
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          cache: true
      # vet + lint + go test + web test + build + no-CDN check + third-party notices check
      - run: mise run ci
