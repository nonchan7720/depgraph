name: third-party-notices

# Renovate cannot run scripts on the hosted app, so dependency updates leave
# THIRD_PARTY_NOTICES.md stale and `licenses:check` fails. This regenerates
# the file on Renovate branches, commits it, and re-runs ci (a push made with
# GITHUB_TOKEN does not trigger workflows; workflow_dispatch does).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: third-party-notices-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  update:
    # same-repository Renovate branches only (never forks). This workflow is
    # not a required check, so skipping it on other PRs is fine.
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the regenerated file
      actions: write # dispatch ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: true
      - name: Regenerate THIRD_PARTY_NOTICES.md
        run: |
          (cd web && pnpm install --frozen-lockfile)
          scripts/third-party-notices.sh
      - name: Commit and re-run ci
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- THIRD_PARTY_NOTICES.md; then
            echo "THIRD_PARTY_NOTICES.md is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_NOTICES.md
          git commit -m "chore: update THIRD_PARTY_NOTICES.md"
          git push origin "HEAD:${BRANCH}"
          gh workflow run ci.yml --ref "${BRANCH}"
